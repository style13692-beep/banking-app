<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account — SecureBank</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --navy: #0a1628;
    --navy2: #0f2044;
    --blue: #1a56db;
    --blue2: #1e429f;
    --gold: #c9a84c;
    --gold2: #f0c674;
    --white: #ffffff;
    --gray: #e8edf5;
    --gray2: #94a3b8;
    --text: #1e293b;
    --danger: #dc2626;
    --success: #16a34a;
    --radius: 12px;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(26,86,219,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(201,168,76,0.08) 0%, transparent 50%);
    pointer-events: none;
}

.grid-bg {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
}

.logo {
    text-align: center;
    margin-bottom: 2rem;
}

.logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.logo-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--white);
    letter-spacing: -0.02em;
}

.logo-name span { color: var(--gold2); }

.card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 2.5rem;
    backdrop-filter: blur(20px);
}

.card-header {
    margin-bottom: 2rem;
}

.card-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--white);
    margin-bottom: 0.4rem;
}

.card-header p {
    color: var(--gray2);
    font-size: 0.9rem;
}

.card-header p a {
    color: var(--gold2);
    text-decoration: none;
    font-weight: 500;
}

.card-header p a:hover { text-decoration: underline; }

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.form-group {
    margin-bottom: 1.25rem;
}

.form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--gray2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
}

.input-wrap {
    position: relative;
}

.input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius);
    padding: 0.8rem 1rem;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
}

.input-wrap input::placeholder { color: rgba(255,255,255,0.25); }

.input-wrap input:focus {
    border-color: var(--gold);
    background: rgba(255,255,255,0.09);
}

.input-wrap input.error { border-color: var(--danger); }
.input-wrap input.valid { border-color: var(--success); }

.field-error {
    font-size: 0.78rem;
    color: #f87171;
    margin-top: 0.35rem;
    display: none;
}

.field-error.show { display: block; }

.password-strength {
    margin-top: 0.5rem;
    display: none;
}

.password-strength.show { display: block; }

.strength-bars {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
}

.strength-bar {
    height: 3px;
    flex: 1;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    transition: background 0.3s;
}

.strength-label {
    font-size: 0.75rem;
    color: var(--gray2);
}

.requirements {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-top: 0.5rem;
    display: none;
}

.requirements.show { display: block; }

.req-item {
    font-size: 0.78rem;
    color: var(--gray2);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
}

.req-item:last-child { margin-bottom: 0; }
.req-item .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.2s; }
.req-item.met { color: #4ade80; }
.req-item.met .dot { background: #4ade80; }

.terms {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 1.5rem;
    font-size: 0.82rem;
    color: var(--gray2);
    line-height: 1.5;
}

.terms input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin-top: 2px;
    accent-color: var(--gold);
    flex-shrink: 0;
    cursor: pointer;
}

.terms a { color: var(--gold2); text-decoration: none; }
.terms a:hover { text-decoration: underline; }

.btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border: none;
    border-radius: var(--radius);
    padding: 0.9rem;
    color: var(--navy);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
}

.btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary.loading {
    position: relative;
    color: transparent;
}

.btn-primary.loading::after {
    content: '';
    position: absolute;
    inset: 0;
    margin: auto;
    width: 20px;
    height: 20px;
    border: 2px solid var(--navy);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.alert {
    padding: 0.9rem 1rem;
    border-radius: var(--radius);
    font-size: 0.88rem;
    margin-bottom: 1.25rem;
    display: none;
    align-items: center;
    gap: 8px;
}

.alert.show { display: flex; }
.alert.error { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
.alert.success { background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.3); color: #86efac; }

.security-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.3);
}

.security-badge svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
    <div class="logo">
        <a href="index.html" class="logo-mark">
            <div class="logo-icon">🏦</div>
            <span class="logo-name">Secure<span>Bank</span></span>
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h1>Create account</h1>
            <p>Already have an account? <a href="signin.html">Sign in</a></p>
        </div>

        <div class="alert error" id="alertError">
            <span>⚠</span><span id="alertErrorMsg"></span>
        </div>
        <div class="alert success" id="alertSuccess">
            <span>✓</span><span id="alertSuccessMsg"></span>
        </div>

        <form id="signupForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label>First name</label>
                    <div class="input-wrap">
                        <input type="text" id="firstName" placeholder="John" autocomplete="given-name"/>
                    </div>
                    <div class="field-error" id="firstNameError">Required</div>
                </div>
                <div class="form-group">
                    <label>Last name</label>
                    <div class="input-wrap">
                        <input type="text" id="lastName" placeholder="Smith" autocomplete="family-name"/>
                    </div>
                    <div class="field-error" id="lastNameError">Required</div>
                </div>
            </div>

            <div class="form-group">
                <label>Email address</label>
                <div class="input-wrap">
                    <input type="email" id="email" placeholder="john@example.com" autocomplete="email"/>
                </div>
                <div class="field-error" id="emailError">Enter a valid email</div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password"/>
                </div>
                <div class="password-strength" id="strengthWrap">
                    <div class="strength-bars">
                        <div class="strength-bar" id="bar1"></div>
                        <div class="strength-bar" id="bar2"></div>
                        <div class="strength-bar" id="bar3"></div>
                        <div class="strength-bar" id="bar4"></div>
                    </div>
                    <div class="strength-label" id="strengthLabel">Too weak</div>
                </div>
                <div class="requirements show" id="requirements">
                    <div class="req-item" id="req-length"><span class="dot"></span>At least 8 characters</div>
                    <div class="req-item" id="req-upper"><span class="dot"></span>One uppercase letter</div>
                    <div class="req-item" id="req-number"><span class="dot"></span>One number</div>
                    <div class="req-item" id="req-special"><span class="dot"></span>One special character</div>
                </div>
                <div class="field-error" id="passwordError">Password is too weak</div>
            </div>

            <div class="form-group">
                <label>Confirm password</label>
                <div class="input-wrap">
                    <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password"/>
                </div>
                <div class="field-error" id="confirmError">Passwords do not match</div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms"/>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. I understand this is a university demonstration project.</label>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
        </form>

        <div class="security-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Secured with Azure Key Vault & JWT
        </div>
    </div>
</div>

<script>
const API = 'http://20.5.49.64:3000/api';

// Password strength
const pwInput = document.getElementById('password');
pwInput.addEventListener('input', () => {
    const val = pwInput.value;
    document.getElementById('strengthWrap').classList.toggle('show', val.length > 0);

    const checks = {
        length: val.length >= 8,
        upper: /[A-Z]/.test(val),
        number: /[0-9]/.test(val),
        special: /[^A-Za-z0-9]/.test(val)
    };

    document.getElementById('req-length').classList.toggle('met', checks.length);
    document.getElementById('req-upper').classList.toggle('met', checks.upper);
    document.getElementById('req-number').classList.toggle('met', checks.number);
    document.getElementById('req-special').classList.toggle('met', checks.special);

    const score = Object.values(checks).filter(Boolean).length;
    const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e'];
    const labels = ['', 'Too weak', 'Weak', 'Good', 'Strong'];
    const bars = ['bar1','bar2','bar3','bar4'];
    bars.forEach((id, i) => {
        document.getElementById(id).style.background = i < score ? colors[score] : 'rgba(255,255,255,0.1)';
    });
    document.getElementById('strengthLabel').textContent = labels[score] || '';
    document.getElementById('strengthLabel').style.color = colors[score] || '';
});

function showError(id, msg) {
    const el = document.getElementById(id);
    if (msg) el.textContent = msg;
    el.classList.add('show');
    document.getElementById(id.replace('Error','') === id ? id : id.replace('Error','')).classList?.add('error');
}
function clearError(id) { document.getElementById(id).classList.remove('show'); }

function showAlert(type, msg) {
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('alertSuccess').classList.remove('show');
    if (type === 'error') {
        document.getElementById('alertErrorMsg').textContent = msg;
        document.getElementById('alertError').classList.add('show');
    } else {
        document.getElementById('alertSuccessMsg').textContent = msg;
        document.getElementById('alertSuccess').classList.add('show');
    }
}

document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    ['firstNameError','lastNameError','emailError','passwordError','confirmError'].forEach(clearError);

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;

    let valid = true;
    if (!firstName) { showError('firstNameError', 'First name is required'); valid = false; }
    if (!lastName) { showError('lastNameError', 'Last name is required'); valid = false; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('emailError', 'Enter a valid email'); valid = false; }
    if (password.length < 8) { showError('passwordError', 'Password must be at least 8 characters'); valid = false; }
    if (password !== confirmPassword) { showError('confirmError', 'Passwords do not match'); valid = false; }
    if (!terms) { showAlert('error', 'Please accept the terms to continue'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
        const res = await fetch(`${API}/auth/signup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, firstName, lastName })
        });
        const data = await res.json();

        if (!res.ok) {
            showAlert('error', data.error || 'Registration failed');
            return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showAlert('success', 'Account created! Redirecting to dashboard...');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
    } catch (err) {
        showAlert('error', 'Cannot connect to server. Please try again.');
    } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
});
</script>
</body>
</html>
