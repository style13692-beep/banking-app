<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — LumeBank</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<!-- Already logged in? Go straight to dashboard -->
<script>
  if (localStorage.getItem('token')) {
    window.location.replace('dashboard.html');
  }
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --g900: #0f1f0f; --g800: #1a3018; --g700: #243f22;
  --g600: #2f5c2c; --g500: #3d7a39; --g50:  #f0f8ef;
  --gold: #c9a84c; --gold-light: #e8c96a;
  --cream: #f8f5ee; --ink: #0e1a0e; --ink-soft: #5a6e5a;
  --white: #ffffff; --border: rgba(15,31,15,0.14);
  --danger: #c0392b; --danger-bg: #fdf2f2;
  --success: #2d6a2d; --success-bg: #f0f8ef;
  --radius: 14px;
}

body { font-family: 'DM Sans', sans-serif; background: var(--cream); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; color: var(--ink); }

.left-panel { background: var(--g800); display: flex; flex-direction: column; justify-content: space-between; padding: 3rem; position: relative; overflow: hidden; min-height: 100vh; }
.left-panel::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 80% 20%, rgba(61,122,57,0.22) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 10% 80%, rgba(201,168,76,0.08) 0%, transparent 55%), radial-gradient(ellipse 40% 40% at 50% 50%, rgba(36,63,34,0.4) 0%, transparent 70%); pointer-events: none; }
.left-top { position: relative; z-index: 1; }
.brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-bottom: 3.5rem; }
.brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; box-shadow: 0 4px 18px rgba(201,168,76,0.4); }
.logo-text { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--white); }
.logo-text em { color: var(--gold-light); font-style: normal; }
.left-headline { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 400; color: var(--white); line-height: 1.2; margin-bottom: 1.25rem; }
.left-headline em { color: var(--gold-light); font-style: italic; }
.left-bottom { position: relative; z-index: 1; font-size: 0.72rem; color: rgba(255,255,255,0.2); }

.right-panel { display: flex; align-items: center; justify-content: center; padding: 2.5rem 2rem; min-height: 100vh; overflow-y: auto; }
.form-card { width: 100%; max-width: 400px; animation: fadeUp 0.5s ease both; }
.form-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 500; color: var(--ink); margin-bottom: 0.4rem; }
.form-sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 2rem; }
.form-sub a { color: var(--g500); text-decoration: none; font-weight: 600; }

.field { margin-bottom: 1.25rem; }
.field label { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.45rem; }
.field input { width: 100%; padding: 0.9rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; background: var(--white); font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--ink); outline: none; transition: all 0.2s; }
.field input:focus { border-color: var(--g500); box-shadow: 0 0 0 3px rgba(61,122,57,0.12); }
.field input.token-input { text-align: center; font-size: 1.5rem; letter-spacing: 0.3em; font-family: monospace; }

.alert-banner { display: none; align-items: center; gap: 10px; padding: 0.85rem 1rem; border-radius: var(--radius); font-size: 0.85rem; font-weight: 500; margin-bottom: 1.25rem; }
.alert-banner.show { display: flex; }
.alert-banner.error { background: var(--danger-bg); border: 1.5px solid rgba(192,57,43,0.2); color: var(--danger); }
.alert-banner.success { background: var(--success-bg); border: 1.5px solid rgba(45,106,45,0.2); color: var(--success); }

.btn-submit { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, var(--g700), var(--g500)); border: none; border-radius: 11px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
.btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(36,63,34,0.4); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

#step2 { display: none; animation: fadeUp 0.3s ease both; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 900px) { body { grid-template-columns: 1fr; } .left-panel { display: none; } }
</style>
</head>
<body>

<div class="left-panel">
  <div class="left-top">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon">🏦</div><span class="logo-text">Lume<em>Bank</em></span>
    </a>
    <h1 class="left-headline">Welcome back to<br><em>secure banking</em></h1>
  </div>
  <div class="left-bottom">© 2026 LumeBank. All rights reserved.</div>
</div>

<div class="right-panel">
  <div class="form-card">
    
    <div class="alert-banner error" id="alertError"><span>⚠</span><span id="alertErrorMsg"></span></div>
    <div class="alert-banner success" id="alertSuccess"><span>✓</span><span id="alertSuccessMsg"></span></div>

    <!-- STEP 1: PASSWORD LOGIN -->
    <div id="step1">
      <div class="form-title">Sign in</div>
      <div class="form-sub">Don't have an account? <a href="signup.html">Create one</a></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">Continue</button>
      </form>
    </div>

    <!-- STEP 2: MFA VERIFICATION -->
    <div id="step2">
      <div class="form-title">2-Step Verification</div>
      <div class="form-sub">Enter the 6-digit code from your authenticator app.</div>

      <form id="mfaForm">
        <div class="field">
          <label for="mfaToken">Security Code</label>
          <input type="text" id="mfaToken" class="token-input" maxlength="6" placeholder="000000" autocomplete="one-time-code" required />
        </div>
        <button type="submit" class="btn-submit" id="verifyBtn">Verify & Login</button>
      </form>
    </div>

  </div>
</div>

<script>
const API_BASE = 'http://localhost:3000/api'; 
let userEmail = "";

// STEP 1: Email & Password
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  
  btn.disabled = true; btn.textContent = "Checking...";
  document.getElementById('alertError').classList.remove('show');

  try {
    const res = await fetch(`${API_BASE}/auth/signin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Login failed');

    if (data.mfaRequired) {
      // Password correct! Move to Step 2
      userEmail = data.email;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('mfaToken').focus();
    } else {
      // Fallback for users without 2FA
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.replace('dashboard.html');
    }
  } catch (err) {
    document.getElementById('alertErrorMsg').textContent = err.message;
    document.getElementById('alertError').classList.add('show');
    btn.disabled = false; btn.textContent = "Continue";
  }
});

// STEP 2: Verify MFA Token
document.getElementById('mfaForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('mfaToken').value.trim();
  const btn = document.getElementById('verifyBtn');
  
  btn.disabled = true; btn.textContent = "Verifying...";
  document.getElementById('alertError').classList.remove('show');

  try {
    const res = await fetch(`${API_BASE}/auth/verify-mfa`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail, token })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Invalid code');

    // MFA Passed! Save Token and go to Dashboard
    document.getElementById('alertSuccessMsg').textContent = "Verified! Redirecting...";
    document.getElementById('alertSuccess').classList.add('show');
    
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    
    setTimeout(() => { window.location.replace('dashboard.html'); }, 1000);

  } catch (err) {
    document.getElementById('alertErrorMsg').textContent = err.message;
    document.getElementById('alertError').classList.add('show');
    btn.disabled = false; btn.textContent = "Verify & Login";
  }
});
</script>
</body>
</html>
